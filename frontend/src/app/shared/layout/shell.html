<div class="min-h-dvh bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 py-3">
      <a routerLink="/" class="text-lg font-semibold tracking-tight text-emerald-800">FutLovers</a>
      <nav aria-label="Principal" class="flex items-center gap-1 text-sm font-medium">
        <a
          routerLink="/"
          routerLinkActive="bg-emerald-100 text-emerald-900"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-full px-3 py-1.5 text-slate-600"
        >
          Jugar
        </a>
        <a
          routerLink="/create"
          routerLinkActive="bg-emerald-100 text-emerald-900"
          class="rounded-full px-3 py-1.5 text-slate-600"
        >
          Crear
        </a>
        @if (auth.isAuthenticated()) {
          <a
            routerLink="/profile"
            routerLinkActive="bg-emerald-100 text-emerald-900"
            class="rounded-full px-3 py-1.5 text-slate-600"
          >
            Perfil
          </a>
        } @else {
          <a routerLink="/login" class="rounded-full px-3 py-1.5 text-slate-600">Entrar</a>
        }
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-4 py-6">
    <router-outlet />
  </main>
</div>
