<section class="mx-auto max-w-md">
  <h1 class="text-2xl font-semibold">Crear partido</h1>
  <p class="mt-1 text-sm text-slate-600">Fútbol 5 · 10 plazas. Tú ocupas una plaza al crearlo.</p>

  @if (loading()) {
    <p class="mt-6 text-sm text-slate-600" role="status">Cargando campos…</p>
  } @else {
    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="block text-sm font-medium" for="startsAt">Fecha y hora</label>
        <input
          id="startsAt"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
          type="datetime-local"
          formControlName="startsAt"
        />
      </div>
      <div>
        <label class="block text-sm font-medium" for="fieldId">Campo</label>
        <select
          id="fieldId"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
          formControlName="fieldId"
        >
          <option value="">Selecciona un campo</option>
          @for (option of fields(); track option.field.id) {
            <option [value]="option.field.id">
              {{ option.venue.name }} · {{ option.field.name }} ({{ option.venue.city }})
            </option>
          }
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium" for="minLevel">Nivel mínimo</label>
          <input
            id="minLevel"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
            type="number"
            min="1"
            max="10"
            formControlName="minLevel"
          />
        </div>
        <div>
          <label class="block text-sm font-medium" for="maxLevel">Nivel máximo</label>
          <input
            id="maxLevel"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
            type="number"
            min="1"
            max="10"
            formControlName="maxLevel"
          />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium" for="notes">Notas</label>
        <textarea
          id="notes"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
          rows="3"
          formControlName="notes"
        ></textarea>
      </div>

      @if (error()) {
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ error() }}</p>
      }

      <button
        class="w-full rounded-lg bg-emerald-700 px-4 py-2.5 font-medium text-white disabled:opacity-60"
        type="submit"
        [disabled]="submitting()"
      >
        @if (submitting()) {
          Creando…
        } @else {
          Crear partido
        }
      </button>
    </form>
  }
</section>
